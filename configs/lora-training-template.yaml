# Starting point for separately supplied models and prepared data.
# Replace MODEL_PATH. Run from the artifact root after preparing your own data.
model_name_or_path: MODEL_PATH
trust_remote_code: false
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
seed: 42
data_seed: 42
dataset: extraction_train
eval_dataset: extraction_validation
dataset_dir: private/prepared
template: empty
cutoff_len: 2048
train_on_prompt: false
preprocessing_num_workers: 16
dataloader_num_workers: 4
output_dir: private/training
logging_steps: 10
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: none
include_num_input_tokens_seen: true
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
per_device_eval_batch_size: 4
learning_rate: 1.0e-4
num_train_epochs: 6.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
val_size: 0.0
eval_strategy: steps
eval_steps: 200
save_strategy: steps
save_steps: 200
load_best_model_at_end: false
